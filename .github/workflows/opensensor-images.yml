name: OpenSensor application image
on:
  workflow_dispatch:
    inputs:
      app:
        description: Application to build
        required: true
        type: choice
        options: [stripe, smtp, fief]
      publish:
        description: Publish the immutable image (does not deploy)
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ inputs.publish }}
          tags: ghcr.io/${{ github.repository_owner }}/saleor-${{ inputs.app }}:${{ github.sha }}
          build-args: |
            APP_NAME=${{ inputs.app }}
            SENTRY_RELEASE=saleor-${{ inputs.app }}@${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.OPENSENSOR_SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=saleor-${{ inputs.app }}
          cache-to: type=gha,scope=saleor-${{ inputs.app }},mode=min
