name: Build and deploy OpenSensor applications
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/hosting_*.py
      - scripts/test_hosting_release.py
      - scripts/wait_hosting_release.py
      - .github/workflows/opensensor-images.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish main images (production deploys follow main pushes)
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
  statuses: read
  actions: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p test_hosting_release.py -v
  build:
    if: github.event_name != 'pull_request'
    needs: [checks, release-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [stripe, smtp, fief]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) }}
          tags: ghcr.io/${{ github.repository_owner }}/saleor-${{ matrix.app }}:${{ github.sha }}
          build-args: |
            APP_NAME=${{ matrix.app }}
            SENTRY_RELEASE=saleor-${{ matrix.app }}@${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.OPENSENSOR_SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=saleor-${{ matrix.app }}
          cache-to: type=gha,scope=saleor-${{ matrix.app }},mode=min
      - name: Record this main build's exact platform image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_APP: ${{ matrix.app }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 scripts/hosting_release_manifest.py
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: hosting-release-${{ matrix.app }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosting-release.json
          if-no-files-found: error
          retention-days: 30
  deploy:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [stripe, smtp, fief]
    concurrency:
      group: saleor-app-${{ matrix.app }}-production-verification
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact production image
        env:
          RELEASE_APP: ${{ matrix.app }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" > /tmp/build-jobs.json
          python3 - <<'PYCODE'
          import json, os
          name = 'build (' + os.environ['RELEASE_APP'] + ')'
          jobs = [j for j in json.load(open('/tmp/build-jobs.json'))['jobs'] if j['name'] == name]
          if len(jobs) != 1 or jobs[0]['conclusion'] != 'success':
              raise SystemExit('This application image build did not succeed')
          PYCODE
          python3 scripts/wait_hosting_release.py
